name: Bot Wen Instagram

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wenbot-publicacao
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar arte e legenda com OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL }}
        run: python robo.py

      - name: Salvar arte no Git
        run: |
          git config user.name "Wen Bot"
          git config user.email "bot@wen.com"
          git add wen_art.jpg wen_art.txt wen_art_idea.txt
          git commit -m "Nova arte gerada pelo WenBot" || exit 0
          git push

      - name: Aguardar GitHub Pages atualizar
        run: |
          for i in {1..12}; do
            CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "https://gjngngvb-byte.github.io/WenBot_Final/wen_art.jpg?v=$GITHUB_RUN_ID-$i")
            echo "Tentativa $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 10
          done
          sleep 20

      - name: Publicar no Instagram via Make (integração existente)
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os, time, requests
          webhook = os.environ.get("MAKE_WEBHOOK_URL")
          if not webhook:
              raise SystemExit("MAKE_WEBHOOK_URL não configurada; publicação cancelada.")
          with open("wen_art.txt", "r", encoding="utf-8") as f:
              legenda = f.read().strip()
          imagem = f"https://gjngngvb-byte.github.io/WenBot_Final/wen_art.jpg?v={int(time.time())}"
          resposta = requests.post(webhook, json={"photo_url": imagem, "caption": legenda}, timeout=60)
          print("Make:", resposta.status_code)
          print(resposta.text[:1000])
          resposta.raise_for_status()
          PY

      - name: Responder comentários de publicações anteriores
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_USERNAME: ${{ vars.IG_USERNAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$IG_USER_ID" ]; then
            echo "Secrets do Instagram não configurados; etapa de comentários ignorada."
            exit 0
          fi
          python responder_comentarios.py

      - name: Salvar estado dos comentários respondidos
        run: |
          git config user.name "Wen Bot"
          git config user.email "bot@wen.com"
          git add comentarios_respondidos.json
          git commit -m "Atualiza controle de comentários respondidos" || exit 0
          git push
