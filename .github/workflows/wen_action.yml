name: Bot Wen Instagram

on:
  # Cinco execuções por dia em UTC. O GitHub pode atrasar execuções agendadas.
  schedule:
    - cron: "0 0,5,10,15,20 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Tarefa para executar"
        required: true
        default: "publish"
        type: choice
        options:
          - "publish"
          - "hashtag_comments"
          - "reply_comments"
      width:
        description: "Largura da imagem (256 a 2048)"
        required: false
        default: "1024"
        type: string
      height:
        description: "Altura da imagem (256 a 2048)"
        required: false
        default: "1024"
        type: string
      seed:
        description: "Semente opcional para repetir a configuração"
        required: false
        type: string
      model:
        description: "Modelo de imagem"
        required: false
        default: "@cf/black-forest-labs/flux-2-klein-9b"
        type: choice
        options:
          - "@cf/black-forest-labs/flux-2-klein-9b"
          - "@cf/black-forest-labs/flux-1-schnell"
      attempts:
        description: "Tentativas por modelo (1 a 10)"
        required: false
        default: "3"
        type: string
      manual_social_override:
        description: "Ignorar pausa apenas nesta ação social manual"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: wenbot-instagram
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Ler controles de pausa das ações sociais
        id: social_controls
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          defaults = {
              "pause_hashtag_comments": True,
              "pause_reply_comments": True,
          }
          try:
              data = json.loads(Path("wenbot_social_controls.json").read_text(encoding="utf-8"))
              if isinstance(data, dict):
                  defaults.update({
                      key: data.get(key, True) is True
                      for key in defaults
                  })
          except Exception as exc:
              print(f"Não foi possível ler os controles; ações sociais ficam pausadas por segurança: {exc}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("hashtag_enabled=" + str(not defaults["pause_hashtag_comments"]).lower() + "\n")
              output.write("reply_enabled=" + str(not defaults["pause_reply_comments"]).lower() + "\n")
          print("Comentários por hashtag:", "ATIVOS" if not defaults["pause_hashtag_comments"] else "PAUSADOS")
          print("Respostas:", "ATIVAS" if not defaults["pause_reply_comments"] else "PAUSADAS")
          PY

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar arte e legenda
        if: ${{ inputs.action != 'hashtag_comments' && inputs.action != 'reply_comments' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WENBOT_WIDTH: ${{ inputs.width || '1024' }}
          WENBOT_HEIGHT: ${{ inputs.height || '1024' }}
          WENBOT_SEED: ${{ inputs.seed }}
          WENBOT_IMAGE_MODEL: ${{ inputs.model || '@cf/black-forest-labs/flux-2-klein-9b' }}
          WENBOT_ATTEMPTS: ${{ inputs.attempts || '3' }}
        run: python robo.py

      - name: Salvar arte no Git
        if: ${{ inputs.action != 'hashtag_comments' && inputs.action != 'reply_comments' }}
        run: |
          git config user.name "Wen Bot"
          git config user.email "bot@wen.com"
          git add wen_art.jpg wen_art.txt wen_art_idea.txt wen_caption_history.json
          git commit -m "Nova arte gerada" || exit 0
          git push

      - name: Publicar diretamente no Instagram
        if: ${{ inputs.action != 'hashtag_comments' && inputs.action != 'reply_comments' }}
        id: publicar
        env:
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from instagrapi import Client

          session_json = os.environ.get("INSTAGRAM_SESSION")
          if not session_json:
              raise SystemExit("Configure o Secret INSTAGRAM_SESSION.")

          try:
              settings = json.loads(session_json)
          except json.JSONDecodeError:
              raise SystemExit("O Secret INSTAGRAM_SESSION não contém JSON válido.")

          legenda = open("wen_art.txt", "r", encoding="utf-8").read().strip()
          if not legenda:
              raise SystemExit("A legenda está vazia; publicação cancelada.")

          cl = Client()
          cl.delay_range = [3, 7]
          try:
              cl.set_settings(settings)
              # Confirma que a sessão ainda está autenticada antes de publicar.
              cl.get_timeline_feed()
              resultado = cl.photo_upload("wen_art.jpg", legenda)
              print("Publicação enviada ao Instagram.")
              print("Media PK:", getattr(resultado, "pk", "não informado"))
              print("Código da publicação:", getattr(resultado, "code", "não informado"))
              media_pk = getattr(resultado, "pk", "")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("media_pk=" + str(media_pk) + "\n")
          except Exception as exc:
              print(f"Falha ao publicar: {type(exc).__name__}: {exc}")
              print(
                  "A sessão pode ter expirado ou o Instagram pode exigir nova "
                  "verificação. Atualize a sessão localmente e substitua o Secret."
              )
              sys.exit(1)
          PY

      - name: Comentar em artes encontradas por hashtags
        if: ${{ inputs.action != 'reply_comments' && (steps.social_controls.outputs.hashtag_enabled == 'true' || (github.event.inputs.manual_social_override == 'true' && inputs.action == 'hashtag_comments')) }}
        env:
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python comentar_artes_hashtags.py
          git config user.name "Wen Bot"
          git config user.email "bot@wen.com"
          if [ -f wen_art_hashtag_comments.json ]; then
            git add wen_art_hashtag_comments.json
            git commit -m "Registrar comentários em artes por hashtag" || true
            git push
          else
            echo "Nenhum histórico de comentários por hashtag foi criado nesta execução."
          fi

      - name: Responder comentários de publicações anteriores
        if: ${{ inputs.action != 'hashtag_comments' && (steps.social_controls.outputs.reply_enabled == 'true' || (github.event.inputs.manual_social_override == 'true' && inputs.action == 'reply_comments')) }}
        env:
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEW_MEDIA_PK: ${{ steps.publicar.outputs.media_pk }}
        run: |
          python responder_comentarios.py
          git config user.name "Wen Bot"
          git config user.email "bot@wen.com"
          if [ -f wen_comment_replies.json ]; then
            git add wen_comment_replies.json
            git commit -m "Registrar respostas aos comentários" || true
            git push
          else
            echo "Nenhum histórico de comentários foi criado nesta execução."
          fi
