name: Bot Wen Instagram

on:
  # Cinco execuções por dia em UTC. O GitHub pode atrasar execuções agendadas.
  schedule:
    - cron: "0 0,5,10,15,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wenbot-instagram
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar arte e legenda
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python robo.py

      - name: Salvar arte no Git
        run: |
          git config user.name "Wen Bot"
          git config user.email "bot@wen.com"
          git add wen_art.jpg wen_art.txt wen_art_idea.txt
          git commit -m "Nova arte gerada" || exit 0
          git push

      - name: Publicar diretamente no Instagram
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import sys
          from instagrapi import Client

          username = os.environ.get("INSTAGRAM_USERNAME")
          password = os.environ.get("INSTAGRAM_PASSWORD")
          if not username or not password:
              raise SystemExit(
                  "Configure os Secrets INSTAGRAM_USERNAME e INSTAGRAM_PASSWORD."
              )

          legenda = open("wen_art.txt", "r", encoding="utf-8").read().strip()
          if not legenda:
              raise SystemExit("A legenda está vazia; publicação cancelada.")

          cl = Client()
          cl.delay_range = [3, 7]
          try:
              cl.login(username, password)
              resultado = cl.photo_upload("wen_art.jpg", legenda)
              print("Publicação enviada ao Instagram.")
              print("Media PK:", getattr(resultado, "pk", "não informado"))
              print("URL:", getattr(resultado, "code", "não informado"))
          except Exception as exc:
              print(f"Falha ao publicar: {type(exc).__name__}: {exc}")
              print(
                  "O Instagram pode exigir verificação, 2FA ou bloquear login "
                  "automatizado. Nenhuma tentativa alternativa foi feita."
              )
              sys.exit(1)
          PY
