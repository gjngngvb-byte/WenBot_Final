name: Bot Wen Instagram

on:
  # Cinco execuções por dia em UTC. O GitHub pode atrasar execuções agendadas.
  schedule:
    - cron: "0 0,5,10,15,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wenbot-instagram
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar arte e legenda
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python robo.py

      - name: Salvar arte no Git
        run: |
          git config user.name "Wen Bot"
          git config user.email "bot@wen.com"
          git add wen_art.jpg wen_art.txt wen_art_idea.txt
          git commit -m "Nova arte gerada" || exit 0
          git push

      - name: Publicar diretamente no Instagram
        env:
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from instagrapi import Client

          session_json = os.environ.get("INSTAGRAM_SESSION")
          if not session_json:
              raise SystemExit("Configure o Secret INSTAGRAM_SESSION.")

          try:
              settings = json.loads(session_json)
          except json.JSONDecodeError:
              raise SystemExit("O Secret INSTAGRAM_SESSION não contém JSON válido.")

          legenda = open("wen_art.txt", "r", encoding="utf-8").read().strip()
          if not legenda:
              raise SystemExit("A legenda está vazia; publicação cancelada.")

          cl = Client()
          cl.delay_range = [3, 7]
          try:
              cl.set_settings(settings)
              # Confirma que a sessão ainda está autenticada antes de publicar.
              cl.get_timeline_feed()
              resultado = cl.photo_upload("wen_art.jpg", legenda)
              print("Publicação enviada ao Instagram.")
              print("Media PK:", getattr(resultado, "pk", "não informado"))
              print("Código da publicação:", getattr(resultado, "code", "não informado"))
          except Exception as exc:
              print(f"Falha ao publicar: {type(exc).__name__}: {exc}")
              print(
                  "A sessão pode ter expirado ou o Instagram pode exigir nova "
                  "verificação. Atualize a sessão localmente e substitua o Secret."
              )
              sys.exit(1)
          PY
